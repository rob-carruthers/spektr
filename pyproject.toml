[project]
name = "spektr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.2.0",
    "python-osc>=1.10.2",
]

[project.scripts]
spektr = "spektr:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY"
]

[tool.pytest.ini_options]
markers = [
    "integration: needs a live sclang with the OSCdefs loaded",
    "slow: is a slow test",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D100", "D103", "PLR2004"]
